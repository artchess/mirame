[project]
name = "mirame"
version = "0.4.0"
description = "Mide hacia dónde mira el predicador en un sermón: a la congregación o a sus notas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacobis Aldana" }]
requires-python = ">=3.12"
keywords = ["predicación", "sermón", "homilética", "mirada", "contacto visual", "mediapipe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Religion",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mediapipe>=1.2.3",
    "opencv-python-headless>=5.1",
    "pandas>=3.1",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
# Capturas PNG del reporte (botón «Capturar» y `mirame capturar`). Además: `playwright install chromium`.
capturas = ["playwright>=1.65"]

[project.urls]
Repository = "https://github.com/jacomv/mirame"
Issues = "https://github.com/jacomv/mirame/issues"

[project.scripts]
mirame = "mirame.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
