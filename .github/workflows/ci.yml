name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --group dev
      - name: Estilo (ruff)
        run: uv run ruff check src tests
      - name: Pruebas (pytest)
        run: uv run pytest -q
      - name: El paquete se construye
        run: uv build

  instalador:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MIRAME_SIN_ABRIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar con instalar.sh desde este commit
        if: runner.os != 'Windows'
        run: MIRAME_FUENTE="file://$GITHUB_WORKSPACE" sh instalar.sh
      - name: Instalar con instalar.ps1 desde este commit
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MIRAME_FUENTE = 'file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          .\instalar.ps1
      - name: mirame responde
        shell: bash
        run: |
          BIN="$HOME/.local/bin"
          "$BIN/mirame" --version
          "$BIN/mirame" lista
