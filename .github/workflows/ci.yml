name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --group dev
      - name: Estilo (ruff)
        run: uv run ruff check src tests
      - name: Pruebas (pytest)
        run: uv run pytest -q
      - name: El paquete se construye
        run: uv build

  instalador:
    name: Instalador (${{ matrix.nombre }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, nombre: linux }
          - { os: macos-latest, nombre: macos }
          - { os: windows-latest, nombre: windows-powershell-5, shell: powershell }
          - { os: windows-latest, nombre: windows-powershell-7, shell: pwsh }
    env:
      MIRAME_SIN_ABRIR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar con instalar.sh desde este commit
        if: runner.os != 'Windows'
        run: MIRAME_FUENTE="file://$GITHUB_WORKSPACE" sh instalar.sh
      # Como en una computadora cualquiera: sin uv, con la política de ejecución
      # restringida y pegando «irm … | iex» (el texto se ejecuta tal como lo baja irm).
      - name: Instalar con «irm | iex» desde este commit
        if: runner.os == 'Windows'
        shell: ${{ matrix.shell }} -NoProfile -Command "& '{0}'"
        run: |
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'uv sigue en el PATH' }
          Set-ExecutionPolicy Restricted -Scope Process -Force
          $env:MIRAME_FUENTE = 'file:///' + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          $texto = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\instalar.ps1"))
          if (-not $texto.Contains('M' + [char]0x00ED + 'rame')) { throw 'Los acentos no se leen bien' }
          $texto | Invoke-Expression
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\mirame.exe")) { throw 'Mirame no quedo instalado' }
      - name: mirame responde
        shell: bash
        run: |
          BIN="$HOME/.local/bin"
          "$BIN/mirame" --version
          "$BIN/mirame" lista
